[project]
name = "qwen3.5-4b-lora-service"
version = "0.1.0"
description = "Qwen3.5-4B LoRA fine-tuning with SwanLab visualization"
requires-python = "==3.12.13"
dependencies = [
    # ── 核心微调依赖（文档推荐纯 transformers + peft 方案）──
    "transformers>=4.57.0",
    "accelerate",
    "datasets",
    "peft",
    "modelscope",
    # ── 训练可视化 ──
    "swanlab",
    # ── 线性注意力加速算子 ──
    "flash-linear-attention",
    "causal-conv1d",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone"

# ── 主 PyPI 镜像（阿里云）─────────────────────────────────────
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# ── 备选 PyPI 镜像（清华源）───────────────────────────────────
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

# ── PyTorch CUDA 13.0 wheel 镜像（阿里云）─────────────────────
[[tool.uv.index]]
name = "pytorch-cu130-aliyun"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu130/"
format = "flat"
explicit = true

# ── 依赖源绑定 ────────────────────────────────────────────────
[tool.uv.sources]
torch = { index = "pytorch-cu130-aliyun" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"