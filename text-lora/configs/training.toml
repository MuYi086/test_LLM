# 16 GB 单卡教学实验；smoke 和 full 都从原模型重新初始化 LoRA。
[training]
max_length = 512
learning_rate = 0.0001
num_train_epochs = 3
per_device_train_batch_size = 1
per_device_eval_batch_size = 1
gradient_accumulation_steps = 8
lora_rank = 8
lora_alpha = 32
lora_dropout = 0.05
seed = 42
data_seed = 42
smoke_steps = 3
loss_scale = "default+ignore_empty_think"
